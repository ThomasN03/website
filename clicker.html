<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        canvas {
            border: 1px solid #d3d3d3;
            background-color: #f1f1f1;
        }
    </style>
</head>

<body onload="startGame()">
    <script>

        var myGamePiece;
        var myScore;

        function startGame() {
            myGamePiece = new component(30, 30, "red", 10, 120);
            myGamePiece.score = 0;
            myScore = new component("30px", "Consolas", "black", 280, 40, "text");
            myScore.text = "SCORE: 0";
            myGameArea.start();
        }

        var myGameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.canvas.width = 480;
                this.canvas.height = 270;
                this.score = 0;
                this.scoreBonus = 0;
                this.context = this.canvas.getContext("2d");
                document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                this.interval = setInterval(updateGameArea, 20);
            },
            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        function component(width, height, color, x, y, type) {
            this.width = width;
            this.height = height;
            this.x = x;
            this.y = y;
            this.type = type;
            this.update = function () {
                var ctx = myGameArea.context;
                if (this.type == "text") {
                    ctx.font = this.width + " " + this.height;
                    ctx.fillStyle = color;
                    ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            }
        }

        function scoreup() {
            myGameArea.score += 1;
            myScore.text = "SCORE: " + myGameArea.score;
            myGameArea.clear();
            myScore.update();
        }

        function scoremore() {
            if (myGameArea.score >= 10) {
                    myGameArea.score += 2;
                    myScore.text = "SCORE: " + myGameArea.score;
                    myGameArea.clear();
                    myScore.update();
            }
        }

        function scoremoremore() {
            if (myGameArea.score >= 20) {
                    myGameArea.score += 4;
                    myScore.text = "SCORE: " + myGameArea.score;
                    myGameArea.clear();
                    myScore.update();
            }
        }

    </script>
    <br>
    <button onclick="scoreup()">click</button>
    <button onclick="scoremore()">bonus</button>
    <button onclick="scoremoremore()">bonus+</button>

</body>

</html>
